<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Hello</title>

  <style>
    body {
      margin: 0;
      height: 100vh;
      display: flex;
      justify-content: center;
      align-items: center;
      background: #111;
      font-family: Arial, sans-serif;
    }

    h1 {
      color: white;
      font-size: 4rem;
      animation: glow 1.5s infinite alternate;
    }

    @keyframes glow {
      from {
        text-shadow: 0 0 10px #00f7ff;
      }
      to {
        text-shadow: 0 0 25px #00f7ff, 0 0 50px #00f7ff;
      }
    }
  </style>
</head>
<body>

  <h1>Hello!</h1>

</body>
</html>
